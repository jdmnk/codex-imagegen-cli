name: Bug report
description: Report a reproducible CLI or packaging problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command you ran and the relevant output. Do not paste Codex auth tokens.
      placeholder: |
        codex-imagegen generate --prompt "..." --out output/imagegen/test.png --dry-run
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: codex-imagegen --version
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, uv version, and Codex CLI version if relevant.
