[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "codex-imagegen-cli"
version = "0.1.0"
description = "Scriptable image generation CLI using Codex ChatGPT auth."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "codex-imagegen-cli contributors"}
]
keywords = ["codex", "image-generation", "cli", "automation", "openai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = [
    "pillow>=11.0",
]

[project.urls]
Homepage = "https://github.com/jdmnk/codex-imagegen-cli"
Repository = "https://github.com/jdmnk/codex-imagegen-cli"
Issues = "https://github.com/jdmnk/codex-imagegen-cli/issues"
Changelog = "https://github.com/jdmnk/codex-imagegen-cli/blob/main/CHANGELOG.md"

[project.scripts]
codex-imagegen = "codex_imagegen_cli.cli:main"
codex-imagegen-cli = "codex_imagegen_cli.cli:main"

[dependency-groups]
dev = [
  "build>=1.2.2.post1",
  "pytest>=8.3",
  "ruff>=0.15.17",
  "twine>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["codex_imagegen_cli"]

[tool.hatch.build.targets.sdist]
include = [
  "/codex_imagegen_cli",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/uv.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
