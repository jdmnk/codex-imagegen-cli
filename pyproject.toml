[build-system]
requires = ["hatchling>=1.32.0,<1.33"]
build-backend = "hatchling.build"

[project]
name = "codex-imagegen-cli"
version = "0.2.0"
description = "Scriptable image generation CLI using Codex ChatGPT auth."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "codex-imagegen-cli contributors"}
]
keywords = ["codex", "image-generation", "cli", "automation", "openai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
]
dependencies = [
    "pillow>=12.3.0",
    "tomli>=2.4.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/jdmnk/codex-imagegen-cli"
Repository = "https://github.com/jdmnk/codex-imagegen-cli"
Issues = "https://github.com/jdmnk/codex-imagegen-cli/issues"
Changelog = "https://github.com/jdmnk/codex-imagegen-cli/blob/main/CHANGELOG.md"

[project.scripts]
codex-imagegen = "codex_imagegen_cli.cli:main"
codex-imagegen-cli = "codex_imagegen_cli.cli:main"

[dependency-groups]
dev = [
  "build>=1.6.1",
  "pytest>=9.1.1",
  "ruff>=0.16.7",
  "twine>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["codex_imagegen_cli"]

[tool.hatch.build.targets.sdist]
include = [
  "/codex_imagegen_cli",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/uv.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in real Codex image generation (consumes account usage)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
