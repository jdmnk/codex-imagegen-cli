[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-imagegen-cli"
version = "0.1.0"
description = "Scriptable CLI wrapper that delegates image generation to a Codex imagegen subagent."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "OpenAI Codex imagegen skill users"}
]
dependencies = []

[project.scripts]
codex-imagegen = "codex_imagegen_cli.cli:main"
codex-imagegen-cli = "codex_imagegen_cli.cli:main"

[tool.setuptools]
packages = ["codex_imagegen_cli"]
